<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENUMBRA</title>
<style>
@font-face{font-family:"Milka";src:url("fuentes/Milka.ttf") format("truetype");font-weight:normal;font-style:normal}
@font-face{font-family:"Josefin";src:url("fuentes/JosefinSans-Light.ttf") format("truetype");font-weight:300;font-style:normal}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{background:#f2f2f0;color:#111;font-family:"Josefin","Josefin Sans",sans-serif;font-weight:300}
header{width:100%;padding:28px 35px 25px;border-bottom:1px solid #111;background:#f2f2f0}
h1{font-family:"Milka",Georgia,serif;font-size:75px;line-height:.9;font-weight:normal;letter-spacing:-2px}
.description{margin-top:18px;font-family:"Josefin","Josefin Sans",sans-serif;font-size:9px;line-height:12px;font-weight:300}
main{width:100%;padding:25px 35px 35px}
.video-container{position:relative;width:100%;aspect-ratio:16/9;background:#111;overflow:hidden}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
@media(max-width:800px){header{padding:25px 20px 20px}h1{font-size:60px}main{padding:20px}}
@media(max-width:500px){header{padding:20px 15px 18px}h1{font-size:45px;letter-spacing:-1px}.description{margin-top:12px}main{padding:15px}.video-container{aspect-ratio:16/9}}
</style>
</head>
<body>
<header>
<h1>PENUMBRA</h1>
<p class="description">Este es el proceso de creación del proyecto.</p>
</header>
<main>
<div class="video-container">
<iframe src="https://www.youtube.com/embed/PbmJ3NqpHPw" title="PENUMBRA — Proceso de creación" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
</div>
</main>
</body>
</html>
